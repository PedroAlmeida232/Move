spring:
  application:
    name: move-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  # JSON da conta de serviço (chave de administrador). Só em variável de ambiente, nunca no Git.
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
