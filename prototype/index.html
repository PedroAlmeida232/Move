<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move</title>
<style>
/* Layout: coluna única para celular, no padrão de listas agrupadas do iOS. Cartões brancos sobre cinza claro, azul só em ações e progresso, folhas que sobem de baixo, barra de abas translúcida. */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --ink:#1C1C1E;
  --muted:#6B6B72;
  --sep:rgba(60,60,67,.16);
  --fill:#EEEEF2;
  --blue:#2563EB;
  --on-blue:#FFFFFF;
  --tint:rgba(37,99,235,.11);
  --r2:#38BDF8;
  --r3:#1E3A8A;
  --bar:rgba(249,249,251,.82);
  --toast:rgba(28,28,30,.92);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#9A9AA1;--sep:rgba(120,120,128,.34);--fill:#2C2C2E;
    --blue:#4C8DFF;--on-blue:#FFFFFF;--tint:rgba(76,141,255,.2);--r2:#5AC8FA;--r3:#8E9BFF;
    --bar:rgba(22,22,24,.82);--toast:rgba(58,58,60,.96);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#9A9AA1;--sep:rgba(120,120,128,.34);--fill:#2C2C2E;
  --blue:#4C8DFF;--on-blue:#FFFFFF;--tint:rgba(76,141,255,.2);--r2:#5AC8FA;--r3:#8E9BFF;
  --bar:rgba(22,22,24,.82);--toast:rgba(58,58,60,.96);
  color-scheme:dark;
}
/* escolha feita nos Ajustes vence o tema do aparelho */
:root.force-light{--bg:#F2F2F7;--card:#FFFFFF;--ink:#1C1C1E;--muted:#6B6B72;--sep:rgba(60,60,67,.16);--fill:#EEEEF2;--blue:#2563EB;--on-blue:#FFFFFF;--tint:rgba(37,99,235,.11);--r2:#38BDF8;--r3:#1E3A8A;--bar:rgba(249,249,251,.82);--toast:rgba(28,28,30,.92);color-scheme:light}
:root.force-dark{--bg:#000000;--card:#1C1C1E;--ink:#F5F5F7;--muted:#9A9AA1;--sep:rgba(120,120,128,.34);--fill:#2C2C2E;--blue:#4C8DFF;--on-blue:#FFFFFF;--tint:rgba(76,141,255,.2);--r2:#5AC8FA;--r3:#8E9BFF;--bar:rgba(22,22,24,.82);--toast:rgba(58,58,60,.96);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.35 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.blue{color:var(--blue)}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{width:30px;height:30px;border-radius:9px;background:#2563EB;color:#fff;display:grid;place-items:center}
.tr{display:flex;align-items:center;gap:8px}
.flame{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:99px;background:var(--card);color:var(--muted);font-weight:600;font-size:15px}
.flame svg{width:18px;height:18px}
.flame.on{color:var(--blue)}
.flame.on svg{fill:var(--blue)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.round.bg{background:var(--card);width:36px;height:36px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em;margin:10px 4px 0}
.dnav{display:flex;gap:6px;align-items:center;flex:none}
.pill{height:36px;padding:0 14px;border-radius:99px;background:var(--card);color:var(--blue);font-weight:600;font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.pad{padding:16px}
.rowi{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;position:relative;width:100%}
.rowi+.rowi::before,.rowi+.body::before,.body+.rowi::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.rowi .g{flex:1;min-width:0}
.rowi .g b{font-weight:500;display:block;overflow-wrap:anywhere}
.rowi .g span{font-size:13px;color:var(--muted);display:block}
.rowi .v{color:var(--muted);flex:none;font-size:15px}
.rowi .chev{color:var(--muted);opacity:.6;width:16px;height:16px}
.rowi.tap{min-height:52px}
.x{flex:none;width:44px;height:44px;margin:-6px -10px -6px 0;display:grid;place-items:center;color:var(--muted)}
.x svg{width:18px;height:18px}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;color:var(--on-blue);flex:none;font-size:12px;font-weight:700}
.dot svg{width:15px;height:15px;stroke-width:3}
.dot.ok{background:var(--blue);border-color:var(--blue)}
.dot.n{color:var(--muted)}
.xpp{font-size:13px;font-weight:600;color:var(--blue);flex:none}
.tag{flex:none;font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--tint);color:var(--blue)}

/* anéis e nível */
.sum{display:flex;align-items:center;gap:18px}
.rings{width:132px;height:132px;flex:none}
.rings circle{fill:none;stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.rings .t{opacity:.16}
.leg{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.leg div{display:flex;flex-direction:column}
.leg span{font-size:13px;font-weight:600}
.leg b{font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.leg b small{font-size:13px;font-weight:500;color:var(--muted)}
.lv{border-top:1px solid var(--sep);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.lv .r{display:flex;justify-content:space-between;font-size:15px}
.lv .r b{font-weight:600}
.bar{height:6px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.bar.c2>i{background:var(--r2)}
.bar.c3>i{background:var(--r3)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.wd i{width:32px;height:32px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--on-blue);font-style:normal}
.wd.part i{background:var(--tint);box-shadow:inset 0 0 0 2px var(--blue)}
.wd.full i{background:var(--blue)}
.wd.today{color:var(--blue)}
.wd svg{width:16px;height:16px;stroke-width:3}

/* treino */
.body{padding:4px 16px 14px;position:relative;display:flex;flex-direction:column;gap:10px}
.hint{font-size:13px;color:var(--blue);background:var(--tint);border-radius:10px;padding:8px 10px;margin-top:10px}
.sets{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.set{display:grid;grid-template-columns:16px minmax(0,1.5fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.set.hd{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em}
.set .k{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.stp{display:flex;align-items:center;background:var(--fill);border-radius:10px;min-width:0}
.stp button{width:38px;height:44px;display:grid;place-items:center;color:var(--blue);flex:none}
.stp button svg{width:18px;height:18px;stroke-width:2.4}
.stp input{flex:1;min-width:0;width:100%;height:44px;border:0;background:none;text-align:center;font-size:17px;font-weight:600;padding:0}
.stp input:focus,.in:focus{outline:2px solid var(--blue);outline-offset:-2px;border-radius:10px}
.in{width:100%;height:44px;border:0;border-radius:10px;background:var(--fill);padding:0 12px;font-size:17px;min-width:0}
input[type="search"].in{-webkit-appearance:none;appearance:none;flex:none}
.set .in{text-align:center;font-weight:600;padding:0 6px}
.in::placeholder,.stp input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.chk{width:44px;height:44px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--muted)}
.chk svg{stroke-width:2.6;opacity:.5}
.chk[aria-pressed="true"]{background:var(--blue);color:var(--on-blue)}
.chk[aria-pressed="true"] svg{opacity:1}
.chk.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
.link{color:var(--blue);font-weight:500;font-size:15px;min-height:44px;padding:0 2px;display:inline-flex;align-items:center}
details{font-size:15px}
details summary{color:var(--blue);font-weight:500;min-height:44px;display:flex;align-items:center;cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details p{color:var(--muted);line-height:1.45;padding-bottom:4px}

.btn{min-height:50px;border-radius:14px;background:var(--fill);color:var(--blue);padding:0 18px;font-weight:600;text-align:center;width:100%}
.btn.primary{background:var(--blue);color:var(--on-blue)}
.btn.danger{color:#D93025}
.btn:active{opacity:.75}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;min-height:40px;border-radius:8px;font-size:14px;font-weight:500;text-align:center;padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.wk button{min-height:44px}
.empty{text-align:center;padding:26px 18px;color:var(--muted);font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;font-weight:600;margin-bottom:4px}
.form{display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .wide{grid-column:1/-1}
.lab{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted);line-height:1.45;padding:0 4px}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .r{display:flex;justify-content:space-between;font-size:15px}
.goal .r b{font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px}
.tile .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.tile .l{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .ln{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .ar{fill:var(--tint)}
.chart .gd{stroke:var(--sep);stroke-width:1}
.chart .pt{fill:var(--card);stroke:var(--blue);stroke-width:2}
.chart .pe{fill:var(--blue);stroke:var(--card);stroke-width:2.5}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.step{font-size:11px;font-weight:600;text-align:center;color:var(--muted);background:var(--fill);border-radius:8px;padding:6px 2px}
.step.on{background:var(--blue);color:var(--on-blue)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--fill);border-radius:12px;padding:10px 12px}
.stat .v{font-weight:700;font-size:22px;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px}
.ach{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:11px;font-weight:500;line-height:1.2}
.ach .ic{width:52px;height:52px;border-radius:50%;background:var(--blue);color:var(--on-blue);display:grid;place-items:center}
.ach.lock{color:var(--muted)}
.ach.lock .ic{background:var(--fill);color:var(--muted)}
.ach.lock .ic svg{opacity:.55}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;margin:20px 0 4px}
.sync i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--blue)}

/* abas, folha, descanso, avisos */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;color:var(--muted)}
nav.tabs button svg{width:25px;height:25px;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--blue)}
#rest{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:6;pointer-events:none;padding:0 16px}
#rest>div{pointer-events:auto;background:var(--toast);color:#fff;border-radius:99px;display:flex;align-items:center;gap:4px;padding:4px 6px 4px 16px;box-shadow:0 8px 24px rgba(0,0,0,.22);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#rest b{font-size:20px;font-weight:700;min-width:52px}
#rest span{font-size:13px;opacity:.75;margin-right:6px}
#rest button{min-height:44px;padding:0 12px;font-weight:600;font-size:15px;color:#8AB4FF}
#toasts{position:fixed;left:0;right:0;bottom:calc(124px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:9;padding:0 16px}
.toast{background:var(--toast);color:#fff;border-radius:99px;padding:10px 16px;font-weight:500;font-size:15px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);animation:tin .28s cubic-bezier(.3,1.3,.5,1);max-width:100%;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.toast .p{color:#8AB4FF;font-weight:700;flex:none}
.toast button{pointer-events:auto;color:#8AB4FF;font-weight:700;min-height:32px;padding:0 4px}
.toast.out{opacity:0;transform:translateY(8px);transition:all .25s}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
#sheet{position:fixed;inset:0;z-index:8;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.4);animation:fade .25s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:90%;display:flex;flex-direction:column;background:var(--bg);border-radius:20px 20px 0 0;animation:up .32s cubic-bezier(.2,.9,.2,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
#sheet .grab{width:36px;height:5px;border-radius:99px;background:var(--sep);margin:8px auto 0;flex:none}
#sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 8px 16px;flex:none;gap:8px}
#sheet .sh b{font-size:17px;font-weight:600}
#sheet .sh button{color:var(--blue);min-height:44px;padding:0 10px;font-weight:600}
#sheet .sc{overflow-y:auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
#sheet .in,#sheet .stp{background:var(--card)}
#sheet .seg{background:var(--sep)}
.sl{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;padding:0 4px;margin-bottom:-8px}
.qty{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qty .stp{width:150px}
.total{text-align:center;font-weight:600;font-size:17px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"></div>
  <main id="app"></main>
  <div id="sync" class="sync"><i></i><span>Carregando…</span></div>
</div>
<div id="rest" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="sheet"></div>
<nav class="tabs" aria-label="Seções">
  <div>
    <button data-act="tab" data-tab="hoje"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/></svg>Hoje</button>
    <button data-act="tab" data-tab="treinos"><svg class="i" viewBox="0 0 24 24"><path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12"/></svg>Treinos</button>
    <button data-act="tab" data-tab="dieta"><svg class="i" viewBox="0 0 24 24"><path d="M5 20c0-9 5-15 15-15 0 10-6 15-15 15z"/><path d="M5 20c2-4 5-7 9-9"/></svg>Dieta</button>
    <button data-act="tab" data-tab="progresso"><svg class="i" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"/></svg>Progresso</button>
  </div>
</nav>
<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var DAYS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
var DAY1=["D","S","T","Q","Q","S","S"];
var DAYS_LONG=["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
var MONTHS=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
var ORDER=[1,2,3,4,5,6,0];
var MEALS=["Café da manhã","Almoço","Lanche","Jantar","Ceia"];
var TABS=["hoje","treinos","dieta","progresso"];
var REDUCED=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function uid(){return "x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parseD(s){var p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2])}
function today(){return ymd(new Date())}
function shortDate(s){var d=parseD(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
function num(v){var n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0}
function nf(v){return String(Math.round(v*10)/10).replace(".",",")}
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/864e5)}

/* ---------- conteúdo fixo ---------- */
var XP={set:10,workout:50,meal:5,mealCap:5,prot:30,weight:15,mission:20,posture:15};
var LEVELS=[{n:"Iniciante",at:0},{n:"Ativo",at:500},{n:"Focado",at:2000},{n:"Forte",at:6000},{n:"Elite",at:15000}];
var IC={
  check:"M5 12.5l4.5 4.5L19 7.5",

function pushRemote(){

function initRemote(){
  if(!window.claude||!window.claude.use){setSync("local");return}
  Promise.all([window.claude.use("db"),window.claude.use("user")]).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user){setSync("local");return}
    return Promise.resolve(user.id()).then(function(id){
      dbDoc=db.collection("data/users/"+id).doc("state");
      var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"))},10000)});
      return Promise.race([dbDoc.get(),timeout]);
    }).then(function(snap){
      var data=null;
      if(snap){
        if(typeof snap.exists==="boolean"&&!snap.exists)data=null;
        else data=typeof snap.data==="function"?snap.data():snap;
      }
      if(data&&data.json){
        var remote=normalize(JSON.parse(data.json));
        if((remote.updatedAt||0)>(S.updatedAt||0)){
          S=remote;
          try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}
          ui.prev=null;render();
        }else if(S.updatedAt){pushRemote()}

  }).catch(function(){setSync(dbDoc?"err":"local")});
}

/* ---------- lógica ---------- */
function planDay(dow){return S.plan[dow]||{name:"Descanso",ex:[]}}
function lastKg(id,before){
  var ds=Object.keys(S.logs).filter(function(x){return x<before}).sort().reverse();
  for(var i=0;i<ds.length;i++){
    var a=S.logs[ds[i]][id];
    if(a){for(var j=a.length-1;j>=0;j--){if(a[j].kg!==""&&a[j].kg!=null)return a[j].kg}}
  }
  return "";
}
function prevMax(id,before){
  var m=0;
  Object.keys(S.logs).forEach(function(dt){
    if(dt>=before)return;
    (S.logs[dt][id]||[]).forEach(function(s){if(s.done)m=Math.max(m,num(s.kg))});
  });
  return m;
}
function isPR(date,id){
  var a=S.logs[date]&&S.logs[date][id];if(!a)return false;
  var pm=prevMax(id,date);if(pm<=0)return false;
  return a.some(function(s){return s.done&&num(s.kg)>pm});
}
function anyPR(date){
  var l=S.logs[date];if(!l)return false;
  return Object.keys(l).some(function(id){return isPR(date,id)});
}
function setsFor(date,ex){
  var l=S.logs[date]&&S.logs[date][ex.id];
  if(l)return l;
  var kg=lastKg(ex.id,date),n=Math.max(1,parseInt(ex.sets,10)||1),a=[];
  for(var i=0;i<n;i++)a.push({kg:kg,reps:"",done:false});
  return a;
}
function ensureSets(date,ex){
  if(!S.logs[date])S.logs[date]={};
  if(!S.logs[date][ex.id])S.logs[date][ex.id]=setsFor(date,ex);
  return S.logs[date][ex.id];
}
function findEx(date,id){
  var ex=planDay(parseD(date).getDay()).ex;

}
function exDone(date,ex){var s=setsFor(date,ex);return s.length>0&&s.every(function(x){return x.done})}
function openId(date){

  if(ui.open==="none")return null;
  if(ui.open&&exs.some(function(e){return e.id===ui.open}))return ui.open;
  for(var i=0;i<exs.length;i++)if(!exDone(date,exs[i]))return exs[i].id;

}
function totals(date){
  var ms=S.meals[date]||[],k=0,p=0;

  return {kcal:Math.round(k),prot:Math.round(p),n:ms.length};

function hasWorkout(date){

}
function weekDates(){
  var d=new Date(),off=(d.getDay()+6)%7,out=[];
  for(var i=0;i<7;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-off+i);out.push(ymd(x))}

function protMet(date){return S.goals.prot>0&&totals(date).prot>=S.goals.prot}
function postureN(date){return (S.posture[date]||[]).filter(Boolean).length}
function missions(date){
  var t=totals(date),training=planDay(parseD(date).getDay()).ex.length>0;
  var first=training?{t:"Complete o treino do dia",ok:!!S.done[date]}:
    {t:"Registre seu peso",ok:S.weights.some(function(w){return w.date===date})};

function stats(){
  var sets=0,xp=0,protDays=0,dates={};
  Object.keys(S.logs).forEach(function(dt){
    dates[dt]=1;
    Object.keys(S.logs[dt]).forEach(function(id){S.logs[dt][id].forEach(function(s){if(s.done)sets++})});
  });
  var workouts=Object.keys(S.done).length;
  xp+=sets*XP.set+workouts*XP.workout;
  Object.keys(S.meals).forEach(function(dt){
    dates[dt]=1;
    xp+=Math.min(S.meals[dt].length,XP.mealCap)*XP.meal;
    if(protMet(dt)){protDays++;xp+=XP.prot}
  });
  S.weights.forEach(function(w){dates[w.date]=1});
  xp+=S.weights.length*XP.weight;
  Object.keys(S.posture).forEach(function(dt){if(postureN(dt)>=POSTURE.length)xp+=XP.posture});
  Object.keys(dates).forEach(function(dt){
    xp+=missions(dt).filter(function(m){return m.ok}).length*XP.mission;

function levelOf(xp){

function calcGoals(f){
  var w=num(f.weight),h=num(f.height),a=num(f.age);
  if(!(w>0&&h>0&&a>0))return null;
  var bmr=10*w+6.25*h-5*a+(f.sex==="f"?-161:5),tdee=bmr*num(f.act||1.55);
  var kcal=Math.max(f.sex==="f"?1200:1500,Math.round((tdee-400)/50)*50);

function forecast(ws){
  var g=num(S.profile.goalW);if(!(g>0)||!ws.length)return "";
  var last=ws[ws.length-1],left=g-last.kg;
  if(Math.abs(left)<0.05)return "Você chegou à meta de "+nf(g)+" kg.";
  var base="Faltam "+nf(Math.abs(left))+" kg para a meta de "+nf(g)+" kg.";
  if(ws.length<2)return base;
  var days=dayDiff(ws[0].date,last.date);if(days<7)return base+" Com mais uma semana de medidas, mostro a previsão.";
  var rate=(last.kg-ws[0].kg)/days;
  if(Math.abs(rate)<0.005||left*rate<=0)return base;
  var d=parseD(last.date);d.setDate(d.getDate()+Math.round(left/rate));
  return base+" No ritmo atual ("+(rate>0?"+":"−")+nf(Math.abs(rate*7))+" kg por semana), você chega lá por volta de "+pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()+".";
}

function confetti(){

  var c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c);
  var W=c.width=window.innerWidth,H=c.height=window.innerHeight,ctx=c.getContext("2d");
  var cols=["#2563EB","#38BDF8","#1E3A8A","#93C5FD"],ps=[];
  for(var i=0;i<70;i++)ps.push({x:W/2+(Math.random()-.5)*80,y:H*.45,vx:(Math.random()-.5)*10,vy:-Math.random()*11-4,s:5+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]});
  var t0=performance.now();
  (function frame(t){
    var el=t-t0;ctx.clearRect(0,0,W,H);
    ps.forEach(function(p){
      p.vy+=.38;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vx*=.99;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,1-el/1500);
      ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);ctx.restore();
    });
    if(el<1500)requestAnimationFrame(frame);else c.remove();

}

function act(fn,msg,opts){
  opts=opts||{};
  var a=snap();
  fn();
  markDone(S,ui.date);
  var b=snap(),fresh=unlockAchs(b.st),party=false;
  persist();
  if(opts.render!==false)render();
  var gain=b.st.xp-a.st.xp;
  if(b.done&&!a.done)toast("Treino concluído. Mandou bem!",gain);
  else if(opts.undo)toast(msg,0,opts.undo);
  else if(gain>0&&msg)toast(msg,gain);
  if(b.pr&&!a.pr)toast("Novo recorde de carga!");
  if(b.lvl>a.lvl){toast("Nível novo: "+LEVELS[b.lvl].n);party=true}
  fresh.forEach(function(x){toast("Conquista: "+x.n);party=true});
  if(party)confetti();
  return b;
}

var rest=null,restTick=null;
function fmtT(s){return Math.floor(s/60)+":"+pad(s%60)}
function drawRest(){
  var el=$("#rest");
  if(!rest){el.hidden=true;el.innerHTML="";return}
  var left=Math.max(0,Math.ceil((rest-Date.now())/1000));
  if(left<=0){stopRest();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}toast("Descanso concluído. Bora!");return}
  if(el.hidden||!el.firstChild){
    el.hidden=false;
    el.innerHTML='<div role="timer"><span>Descanso</span><b class="num" id="restv"></b><button data-act="restadd">+15 s</button><button data-act="restskip">Pular</button></div>';
  }
  $("#restv").textContent=fmtT(left);
}
function startRest(){
  var s=parseInt(S.profile.rest,10)||0;if(s<=0)return;
  rest=Date.now()+s*1000;clearInterval(restTick);restTick=setInterval(drawRest,250);drawRest();
}
function stopRest(){rest=null;clearInterval(restTick);drawRest()}

function chart(pts,label){
  var W=340,H=150,L=34,R=12,T=14,B=26,w=W-L-R,h=H-T-B;
  var vals=pts.map(function(p){return p.v}),mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals);
  if(mx-mn<0.5){mn-=0.25;mx+=0.25}
  function X(i){return L+(pts.length===1?w/2:i*w/(pts.length-1))}
  function Y(v){return T+h-(v-mn)/(mx-mn)*h}
  var line=pts.map(function(p,i){return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)}).join(" ");
  var area=line+" L"+X(pts.length-1).toFixed(1)+" "+(T+h)+" L"+X(0).toFixed(1)+" "+(T+h)+" Z";
  var dots=pts.map(function(p,i){return i===pts.length-1?"":'<circle class="pt" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="3"/>'}).join("");
  var last=pts[pts.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+label+'">'+
    '<line class="gd" x1="'+L+'" x2="'+(W-R)+'" y1="'+T+'" y2="'+T+'"/><line class="gd" x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+h)+'" y2="'+(T+h)+'"/>'+
    '<text x="'+(L-6)+'" y="'+(T+3)+'" text-anchor="end">'+nf(mx)+'</text><text x="'+(L-6)+'" y="'+(T+h+3)+'" text-anchor="end">'+nf(mn)+'</text>'+
    '<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'"/>'+dots+
    '<circle class="pe" cx="'+X(pts.length-1).toFixed(1)+'" cy="'+Y(last.v).toFixed(1)+'" r="5"/>'+
    '<text x="'+L+'" y="'+(H-6)+'">'+shortDate(pts[0].date)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+shortDate(last.date)+'</text></svg>';
}

  q=(q||"").trim().toLowerCase();
  function m(n){return !q||n.toLowerCase().indexOf(q)>=0}
  var h="",saved=S.saved.filter(function(s){return m(s.name)}),rec=S.foods.filter(function(f){return m(f.name)}).slice(0,6),com=FOODS.filter(function(f){return m(f[0])});
  if(saved.length)h+='<div class="sl">Refeições salvas</div><section class="card">'+saved.map(function(s){
    var k=s.items.reduce(function(a,i){return a+num(i.kcal)},0);
    return '<div class="rowi"><button class="g" data-act="usesaved" data-id="'+s.id+'"><b>'+esc(s.name)+'</b><span class="num">'+s.items.length+(s.items.length===1?" item":" itens")+' · '+Math.round(k)+' kcal</span></button><button class="x" data-act="delsaved" data-id="'+s.id+'" aria-label="Apagar refeição salva">'+icon("close")+'</button></div>';
  }).join("")+'</section>';
  if(rec.length)h+='<div class="sl">Recentes</div><section class="card">'+rec.map(function(f){
    return '<button class="rowi tap" data-act="pickfood" data-src="r" data-i="'+S.foods.indexOf(f)+'"><div class="g"><b>'+esc(f.name)+'</b><span class="num">'+Math.round(num(f.kcal))+' kcal · '+nf(num(f.prot))+' g de proteína</span></div></button>';
  }).join("")+'</section>';
  if(com.length)h+='<div class="sl">Alimentos comuns (valores aproximados)</div><section class="card">'+com.map(function(f){
    return '<button class="rowi tap" data-act="pickfood" data-src="c" data-i="'+FOODS.indexOf(f)+'"><div class="g"><b>'+f[0]+'</b><span class="num">'+f[1]+' · '+f[2]+' kcal · '+nf(f[3])+' g de proteína</span></div></button>';
  }).join("")+'</section>';
  if(!h)h='<div class="empty">Nada encontrado. Você pode digitar os valores do alimento.</div>';
  return h;
}
function foodTotal(f){var q=num(f.qty)||1;return Math.round(num(f.kcal)*q)+' kcal · '+nf(num(f.prot)*q)+' g de proteína'}
function sheetHtml(){
  var sh=ui.sheet,f=sh.f,t="",b="";
  if(sh.type==="food"&&f.step==="list"){
    t="Adicionar alimento";
    b='<input class="in" data-sf="q" id="sf-q" type="search" placeholder="Buscar alimento" value="'+esc(f.q)+'" aria-label="Buscar alimento">'+
      '<button class="btn" data-act="manualfood">Digitar outro alimento</button><div id="flist" class="stack" style="gap:14px">'+foodRows(f.q)+'</div>';
  }else if(sh.type==="food"){
    t=f.portion?"Quantidade":"Novo alimento";
    b='<div class="form"><div class="fields">'+fld("Alimento","name",f,'placeholder="Ex.: Omelete com 3 ovos"',true)+
      fld("Calorias"+(f.portion?" por porção":" (kcal)"),"kcal",f,'inputmode="decimal"')+fld("Proteína"+(f.portion?" por porção":"")+" (g)","prot",f,'inputmode="decimal"')+'</div>'+
      '<div class="qty"><div><b style="font-weight:500">Porções</b>'+(f.portion?'<div class="small muted">1 porção = '+esc(f.portion)+'</div>':"")+'</div><div class="stp"><button data-act="qty" data-d="-0.5" aria-label="Menos">'+icon("minus")+'</button><input id="qtyv" value="'+nf(f.qty)+'" readonly aria-label="Porções"><button data-act="qty" data-d="0.5" aria-label="Mais">'+icon("plus")+'</button></div></div>'+
      '<label class="lab">Refeição<select class="in" data-sf="meal" id="sf-meal">'+MEALS.map(function(m){return '<option'+(m===f.meal?" selected":"")+'>'+m+'</option>'}).join("")+'</select></label>'+
      '<div class="total num" id="ftotal">'+foodTotal(f)+'</div><button class="btn primary" data-act="savefood">Adicionar</button><button class="btn" data-act="foodback">Voltar à lista</button></div>';
  }else if(sh.type==="ex"){
    t=f.id?"Editar exercício":"Novo exercício";
    b='<div class="form"><div class="fields">'+fld("Nome","name",f,'placeholder="Ex.: Remada curvada"',true)+fld("Séries","sets",f,'inputmode="numeric"')+fld("Repetições","reps",f,'placeholder="Ex.: 10 ou 30s"')+'</div>'+
      '<button class="btn primary" data-act="saveex">'+(f.id?"Salvar":"Adicionar")+'</button>'+
      (f.id?'<div class="two"><button class="btn" data-act="moveex" data-d="-1">Mover para cima</button><button class="btn" data-act="moveex" data-d="1">Mover para baixo</button></div>'+
      '<button class="btn danger" data-act="rmex">'+(f.ask?"Toque de novo para remover":"Remover exercício")+'</button>':"")+'</div>';
  }else if(sh.type==="weight"){
    t="Registrar peso";
    b='<div class="form"><div class="fields">'+fld("Data","date",f,'type="date"',true)+fld("Peso (kg)","kg",f,'inputmode="decimal" placeholder="Ex.: 82,4"')+fld("Cintura (cm), opcional","waist",f,'inputmode="decimal"')+'</div>'+
      '<button class="btn primary" data-act="saveweight">Salvar</button></div>';
  }else if(sh.type==="settings"){
    t="Ajustes";
    b='<div class="sl">Metas diárias</div><div class="fields">'+fld("Calorias (kcal)","kcal",f,'inputmode="numeric"')+fld("Proteína (g)","prot",f,'inputmode="numeric"')+'</div>'+
      '<div class="sl">Calcular metas para você</div><div class="form">'+seg("sex",[["m","Homem"],["f","Mulher"]],f.sex)+
      '<div class="fields">'+fld("Idade","age",f,'inputmode="numeric"')+fld("Altura (cm)","height",f,'inputmode="numeric"')+fld("Peso (kg)","weight",f,'inputmode="decimal"')+fld("Meta de peso (kg)","goalW",f,'inputmode="decimal"')+'</div>'+
      '<label class="lab">Treinos por semana'+seg("act",[["1.375","1 a 3"],["1.55","3 a 5"],["1.725","6 ou mais"]],f.act)+'</label>'+
      '<button class="btn" data-act="calc">Calcular metas</button><p class="note" id="calcmsg">'+esc(f.msg||"Estimativa pela fórmula de Mifflin-St Jeor, com déficit moderado para perder gordura e 1,8 g de proteína por kg. Ajuste com sua médica ou nutricionista.")+'</p></div>'+
      '<div class="sl">Treino</div><label class="lab">Lado mais fraco (pergunte à sua médica)'+seg("side",[["e","Esquerdo"],["d","Direito"],["","Não sei"]],f.side)+'</label>'+
      '<label class="lab">Descanso entre séries'+seg("rest",[["0","Sem"],["45","45 s"],["60","60 s"],["90","90 s"],["120","2 min"]],f.rest)+'</label>'+
      '<div class="sl">Aparência</div>'+seg("theme",[["","Automático"],["light","Claro"],["dark","Escuro"]],f.theme)+
      '<button class="btn primary" data-act="savesettings">Salvar</button>';
  }
  return '<div class="bk" data-act="closesheet"></div><div class="panel" role="dialog" aria-modal="true" aria-label="'+t+'"><div class="grab"></div><div class="sh"><b>'+t+'</b><button data-act="closesheet">Fechar</button></div><div class="sc">'+b+'</div></div>';
}
function drawSheet(keepScroll){
  var el=$("#sheet"),sc=keepScroll&&$("#sheet .sc"),y=sc?sc.scrollTop:0;
  if(!ui.sheet){el.className="";el.innerHTML="";return}
  var was=el.className==="on";
  el.innerHTML=sheetHtml();el.className="on";
  if(was){var p=$("#sheet .panel"),k=$("#sheet .bk");p.style.animation="none";k.style.animation="none"}
  if(y)$("#sheet .sc").scrollTop=y;
}
function openSheet(type,f){ui.sheet={type:type,f:f};drawSheet()}
function closeSheet(){ui.sheet=null;drawSheet()}
function mealNow(){var h=new Date().getHours();return h<10?MEALS[0]:h<15?MEALS[1]:h<18?MEALS[2]:h<22?MEALS[3]:MEALS[4]}

/* ---------- eventos ---------- */
function shiftDay(n){var d=parseD(ui.date);d.setDate(d.getDate()+n);ui.date=ymd(d);ui.open=null}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act,row,ex,f=ui.sheet&&ui.sheet.f,day;
  if(a==="tab"){ui.tab=b.dataset.tab;try{location.hash=ui.tab}catch(x){}window.scrollTo(0,0);render();return}
  if(a==="day"){shiftDay(parseInt(b.dataset.d,10));render();return}
  if(a==="gotoday"){ui.date=today();ui.open=null;render();return}
  if(a==="closesheet"){closeSheet();return}
  if(a==="restadd"){if(rest){rest+=15000;drawRest()}return}
  if(a==="restskip"){stopRest();return}

  /* treino do dia */
  if(a==="openex"){ui.open=openId(ui.date)===b.dataset.id?"none":b.dataset.id;render();return}
  if(a==="toggle"){
    row=b.closest(".set");ex=findEx(ui.date,row.dataset.ex);if(!ex)return;
    var exId=ex.id,i=+row.dataset.i,on=false;
    var res=act(function(){
      var arr=ensureSets(ui.date,ex);arr[i].done=!arr[i].done;on=arr[i].done;
      if(on&&!arr[i].reps)arr[i].reps=ex.reps;
      if(on&&arr.every(function(s){return s.done}))ui.open=null;else ui.open=exId;
    },"Mais uma série. Bora!");
    if(on){
      var nb=$('.set[data-ex="'+exId+'"][data-i="'+i+'"] .chk');if(nb)nb.classList.add("pop");
      if(res.done)stopRest();else startRest();
    }
    return;
  }
  if(a==="kg"){
    row=b.closest(".set");ex=findEx(ui.date,row.dataset.ex);if(!ex)return;
    var ii=+row.dataset.i,dd=num(b.dataset.d);
    ui.open=ex.id;
    act(function(){var arr=ensureSets(ui.date,ex),v=Math.max(0,num(arr[ii].kg)+dd);arr[ii].kg=v>0?nf(v):""});return;
  }
  if(a==="addset"){
    ex=findEx(ui.date,b.dataset.ex);if(!ex)return;
    ui.open=ex.id;
    act(function(){var arr=ensureSets(ui.date,ex);arr.push({kg:arr.length?arr[arr.length-1].kg:"",reps:"",done:false})});return;
  }
  if(a==="postopen"){ui.postOpen=!ui.postOpen;render();return}
  if(a==="post"){
    var pi=+b.dataset.i;
    act(function(){var arr=S.posture[ui.date]||(S.posture[ui.date]=POSTURE.map(function(){return false}));arr[pi]=!arr[pi]},"Rotina de postura concluída.");return;
  }

  /* plano */
  if(a==="planday"){ui.planDay=parseInt(b.dataset.d,10);render();return}
  if(a==="addex"){openSheet("ex",{id:"",name:"",sets:"3",reps:"10"});var n=$("#sf-name");if(n)n.focus();return}
  if(a==="editex"){
    ex=planDay(ui.planDay).ex.filter(function(x){return x.id===b.dataset.id})[0];if(!ex)return;
    openSheet("ex",{id:ex.id,name:ex.name,sets:String(ex.sets),reps:ex.reps});return;
  }
  if(a==="saveex"){
    var name=f.name.trim();if(!name){$("#sf-name").focus();return}
    var sets=Math.max(1,parseInt(f.sets,10)||3),reps=f.reps.trim()||"10";
    day=planDay(ui.planDay);if(!S.plan[ui.planDay])S.plan[ui.planDay]=day;
    if(f.id)day.ex.forEach(function(x){if(x.id===f.id){x.name=name;x.sets=sets;x.reps=reps}});
    else day.ex.push({id:uid(),name:name,sets:sets,reps:reps});
    closeSheet();persist();render();return;
  }
  if(a==="moveex"){
    day=planDay(ui.planDay);var ix=-1;day.ex.forEach(function(x,k){if(x.id===f.id)ix=k});
    var to=ix+parseInt(b.dataset.d,10);if(ix<0||to<0||to>=day.ex.length)return;
    var tmp=day.ex[ix];day.ex[ix]=day.ex[to];day.ex[to]=tmp;persist();render();toast("Ordem atualizada.");return;
  }
  if(a==="rmex"){
    if(!f.ask){f.ask=true;drawSheet(true);return}
    day=planDay(ui.planDay);var gone=null,at=0;day.ex.forEach(function(x,k){if(x.id===f.id){gone=x;at=k}});
    var dw=ui.planDay;
    day.ex=day.ex.filter(function(x){return x.id!==f.id});closeSheet();persist();render();
    if(gone)toast("Exercício removido.",0,function(){planDay(dw).ex.splice(at,0,gone);persist();render()});
    return;
  }

  /* dieta */
  if(a==="addfood"){openSheet("food",{step:"list",q:"",name:"",kcal:"",prot:"",portion:"",qty:1,meal:mealNow()});return}
  if(a==="manualfood"){f.step="form";f.name=f.q;f.kcal="";f.prot="";f.portion="";f.qty=1;drawSheet();var mn=$("#sf-name");if(mn)mn.focus();return}
  if(a==="foodback"){f.step="list";drawSheet();return}
  if(a==="pickfood"){
    var src=b.dataset.src,it=src==="c"?FOODS[+b.dataset.i]:S.foods[+b.dataset.i];if(!it)return;
    f.step="form";f.qty=1;
    if(src==="c"){f.name=it[0];f.portion=it[1];f.kcal=String(it[2]);f.prot=nf(it[3])}
    else{f.name=it.name;f.portion=it.portion||"";f.kcal=String(it.kcal);f.prot=nf(num(it.prot))}
    drawSheet();return;
  }
  if(a==="qty"){
    f.qty=Math.max(0.5,Math.min(20,num(f.qty)+num(b.dataset.d)));
    $("#qtyv").value=nf(f.qty);$("#ftotal").textContent=foodTotal(f);return;
  }
  if(a==="savefood"){
    var nm=f.name.trim();if(!nm){$("#sf-name").focus();return}
    var q=num(f.qty)||1,pk=num(f.kcal),pp=num(f.prot);
    var item={id:uid(),meal:f.meal,name:nm+(q!==1?" ("+nf(q)+" porções)":""),kcal:Math.round(pk*q),prot:Math.round(pp*q*10)/10};
    closeSheet();
    act(function(){
      (S.meals[ui.date]||(S.meals[ui.date]=[])).push(item);
      S.foods=[{name:nm,kcal:pk,prot:pp,portion:f.portion}].concat(S.foods.filter(function(x){return x.name!==nm})).slice(0,20);
    },"Refeição registrada.");return;
  }
  if(a==="usesaved"){
    var sv=S.saved.filter(function(s){return s.id===b.dataset.id})[0];if(!sv)return;
    var meal=f.meal;closeSheet();
    act(function(){
      var arr=S.meals[ui.date]||(S.meals[ui.date]=[]);
      sv.items.forEach(function(it){arr.push({id:uid(),meal:meal,name:it.name,kcal:it.kcal,prot:it.prot})});
    },"Refeição registrada.");return;
  }
  if(a==="delsaved"){S.saved=S.saved.filter(function(s){return s.id!==b.dataset.id});persist();$("#flist").innerHTML=foodRows(f.q);return}
  if(a==="savemeal"){
    var mt=b.dataset.meal,its=(S.meals[ui.date]||[]).filter(function(m){return m.meal===mt});if(!its.length)return;
    var nm2=mt+": "+its.map(function(m){return m.name}).slice(0,2).join(", ")+(its.length>2?" e mais "+(its.length-2):"");
    S.saved=[{id:uid(),name:nm2,items:its.map(function(m){return {name:m.name,kcal:m.kcal,prot:m.prot}})}].concat(S.saved.filter(function(s){return s.name!==nm2})).slice(0,20);
    persist();toast("Refeição salva. Ela aparece em Adicionar alimento.");return;
  }
  if(a==="delmeal"){
    var list=S.meals[ui.date]||[],gm=null,gi=0,dt0=ui.date;list.forEach(function(m,k){if(m.id===b.dataset.id){gm=m;gi=k}});if(!gm)return;
    act(function(){S.meals[dt0]=list.filter(function(m){return m.id!==gm.id});if(!S.meals[dt0].length)delete S.meals[dt0]},"Alimento removido.",
      {undo:function(){act(function(){(S.meals[dt0]||(S.meals[dt0]=[])).splice(gi,0,gm)})}});return;
  }

  /* peso e ajustes */
  if(a==="addweight"){openSheet("weight",{date:ui.date,kg:"",waist:""});var wk=$("#sf-kg");if(wk)wk.focus();return}
  if(a==="saveweight"){
    var kg=num(f.kg),dt=f.date||ui.date;if(kg<=0){$("#sf-kg").focus();return}
    var entry={date:dt,kg:kg};if(num(f.waist)>0)entry.waist=num(f.waist);
    closeSheet();
    act(function(){S.weights=S.weights.filter(function(w){return w.date!==dt});S.weights.push(entry)},"Peso registrado.");return;
  }
  if(a==="delweight"){
    var gw=S.weights.filter(function(w){return w.date===b.dataset.date})[0];if(!gw)return;
    act(function(){S.weights=S.weights.filter(function(w){return w!==gw})},"Medida removida.",{undo:function(){act(function(){S.weights.push(gw)})}});return;
  }
  if(a==="settings"){
    var ws=sortedWeights(),p=S.profile;
    openSheet("settings",{kcal:String(S.goals.kcal),prot:String(S.goals.prot),sex:p.sex,age:String(p.age||""),height:String(p.height||""),weight:ws.length?nf(ws[ws.length-1].kg):"",goalW:String(p.goalW||""),act:String(p.act),side:p.side,rest:String(p.rest),theme:p.theme||"",msg:""});return;
  }
  if(a==="segset"){f[b.dataset.k]=b.dataset.v;drawSheet(true);return}
  if(a==="calc"){
    var g=calcGoals(f);
    if(!g){f.msg="Preencha idade, altura e peso para calcular.";drawSheet(true);return}
    f.kcal=String(g.kcal);f.prot=String(g.prot);
    f.msg="Seu gasto estimado é de "+g.tdee+" kcal por dia. Sugestão: "+g.kcal+" kcal e "+g.prot+" g de proteína. Os campos de metas já foram preenchidos; toque em Salvar para aplicar.";
    drawSheet(true);return;
  }
  if(a==="savesettings"){
    var gk=Math.round(num(f.kcal)),gp=Math.round(num(f.prot));
    closeSheet();
    act(function(){
      if(gk>0)S.goals.kcal=gk;if(gp>0)S.goals.prot=gp;
      S.profile={sex:f.sex,age:f.age,height:f.height,act:f.act,side:f.side,rest:parseInt(f.rest,10)||0,goalW:f.goalW,theme:f.theme};
    },"Ajustes salvos.");
    toast("Ajustes salvos.");return;
  }
});
document.addEventListener("input",function(e){
  var t=e.target;if(!t.dataset||!t.dataset.sf||!ui.sheet)return;
  var f=ui.sheet.f;f[t.dataset.sf]=t.value;
  if(t.dataset.sf==="q"){var fl=$("#flist");if(fl)fl.innerHTML=foodRows(t.value)}
  if(ui.sheet.type==="food"&&$("#ftotal"))$("#ftotal").textContent=foodTotal(f);
});
document.addEventListener("change",function(e){
  var t=e.target;if(!t.dataset)return;
  if(t.dataset.sf&&ui.sheet){ui.sheet.f[t.dataset.sf]=t.value;return}
  if(t.dataset.f){
    var row=t.closest(".set"),ex=findEx(ui.date,row.dataset.ex);if(!ex)return;
    var fk=t.dataset.f,i=+row.dataset.i,v=t.value.trim();
    /* sem redesenhar a tela, para não tirar o foco do próximo campo */
    act(function(){ensureSets(ui.date,ex)[i][fk]=v},null,{render:false});return;
  }
  if(t.dataset.chg==="dayname"){
    var day=planDay(ui.planDay);if(!S.plan[ui.planDay])S.plan[ui.planDay]=day;
    day.name=t.value.trim()||day.name;persist();return;
  }
  if(t.dataset.chg==="loadex"){ui.loadEx=t.value;render()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&ui.sheet)closeSheet()});
window.addEventListener("hashchange",function(){
  var h=location.hash.replace("#","");
  if(TABS.indexOf(h)>=0&&h!==ui.tab){ui.tab=h;render()}
});
var h0=location.hash.replace("#","");
if(TABS.indexOf(h0)>=0)ui.tab=h0;
render();
initRemote();
})();
</script>
